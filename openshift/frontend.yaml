# oc apply -f openshift/frontend.yaml   (after pushing the image to a registry the cluster can pull)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: { app: frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: REPLACE_WITH_IMAGE   # e.g. quay.io/hold-my-laptop/cfo-frontend:latest
          ports:
            - containerPort: 8080
          env:
            - name: BACKEND_URL
              value: http://backend:8000   # name of the backend Service
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: frontend
spec:
  to: { kind: Service, name: frontend }
  port: { targetPort: 8080 }
  tls: { termination: edge, insecureEdgeTerminationPolicy: Redirect }
